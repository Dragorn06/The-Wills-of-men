name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Hi thanks for reporting an issue remember to read the code of conduct before posting'
        pr-message: 'Hi thanks for adding to my game your help is appreciated please remember to read the code of conduct before posting'
